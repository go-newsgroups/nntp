name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CGO_ENABLED: "0"
  GOWORK: "off"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - name: Vet
        run: go vet ./...
      - name: Test with coverage
        run: go test -covermode=set -coverprofile=cover.out ./...
      - name: Enforce 100% coverage
        run: |
          go tool cover -func=cover.out
          pct=$(go tool cover -func=cover.out | awk '/^total:/{print $3}' | tr -d '%')
          awk -v p="$pct" 'BEGIN{exit (p+0<100.0)?1:0}'

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - linux/riscv64
          - linux/ppc64le
          - linux/s390x
          - linux/loong64
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - name: Build ${{ matrix.target }}
        run: |
          GOOS=${{ matrix.target }}
          export GOOS=${GOOS%/*}
          export GOARCH=$(echo "${{ matrix.target }}" | cut -d/ -f2)
          go build ./...
